version: 2
updates:
  # JavaScript/TypeScript workspace (pnpm).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      js-dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      js-production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      # Tailwind 4 is a CSS-first rewrite (new Vite/PostCSS plugins, no
      # tailwind.config.ts, different Astro integration): migrate deliberately,
      # not through a weekly bump.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  # Go backend.
  - package-ecosystem: gomod
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # Go CLI.
  - package-ecosystem: gomod
    directory: "/cli"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"

# HeapDeck nginx config — serves SPA and proxies API
#
# Features:
# - Serves static assets from /usr/share/nginx/html
# - Proxies /api/* to backend API
# - Directs all other routes to index.html (SPA routing)
# - Gzip compression, caching headers, security headers

server {
    listen 3000;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cross-Origin Isolation headers for SQLite OPFS (SharedArrayBuffer)
    # Using 'credentialless' allows cross-origin assets without CORP (mostly)
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/wasm;

    # Static assets — cache heavily
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeat inherited headers because add_header is present here
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # Hashed assets (Vite places here)
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeat inherited headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }

    # Marketing landing (static Astro container). The edge Caddy predates
    # the landing and sends everything here, so the web tier routes the
    # marketing paths itself; the SPA keeps every other path.
    # Lazy DNS via variables: if the landing container is absent (dev
    # setups, broken deploy), nginx serves 502 on these paths instead of
    # refusing to boot and taking the whole app down.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location = / {
        set $landing_upstream "http://landing:3000";
        proxy_pass $landing_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /es {
        set $landing_upstream "http://landing:3000";
        proxy_pass $landing_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /_astro/ {
        set $landing_upstream "http://landing:3000";
        proxy_pass $landing_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy — pass to backend
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check — no auth required
    location = /healthz {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # Internal redirects re-run location matching, so both direct and
        # fallback requests for the shell get this: the SPA index must
        # never be heuristically cached by browsers (stale shell after
        # deploys). Hashed assets keep their immutable caching above.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Cross-Origin-Embedder-Policy "credentialless" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
        }

        # Ensure correct MIME types for special assets
        location ~* \.webmanifest$ {
            add_header Content-Type application/manifest+json;
            # Repeat inherited headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Cross-Origin-Embedder-Policy "credentialless" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
        }
        location ~* \.wasm$ {
            add_header Content-Type application/wasm;
            # Repeat inherited headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Cross-Origin-Embedder-Policy "credentialless" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
        }
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
# HeapDeck landing nginx config — static Astro site
#
# Serves the marketing landing. The host Caddy routes /, /es and /_astro/*
# here; everything else (SPA, API) never reaches this container.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;

    # nginx would otherwise 301 "/es" → "/es/" using its own absolute URL;
    # serve the Spanish index directly on both spellings.
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # Hashed Astro assets — cache forever
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Spanish landing (dist/es/index.html)
    location /es {
        try_files $uri $uri/index.html $uri/ /es/index.html;
    }

    # Root landing + fallback for unknown asset paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}

[package]
name = "heapdeck"
version = "0.6.0"
description = "HeapDeck — your personal dev multi-tool. Desktop app."
authors = ["HeapDeck contributors"]
license = "Apache-2.0"
repository = "https://github.com/tiagofur/heapdeck"
edition = "2021"
# tauri-plugin-deep-link (Phase 2) requires 1.90; keep the floor there so the
# whole workspace agrees on one minimum.
rust-version = "1.90"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "heapdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

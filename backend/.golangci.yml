version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - gosec # security-focused checks (the point of adding a linter here)
    - bodyclose
    - misspell
  exclusions:
    rules:
      # Tests and tooling may ignore errors / use weaker constructs.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
      - path: internal/tools/
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports

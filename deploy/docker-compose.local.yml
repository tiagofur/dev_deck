services:
  db:
    image: pgvector/pgvector:pg16
    container_name: heapdeck-db-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: heapdeck
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_DB: heapdeck
    ports:
      - "5432:5432"
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heapdeck -d heapdeck"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: postgres:16-alpine
    container_name: heapdeck-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${PG_PASS}
    volumes:
      - ../backend/migrations:/migrations:ro
    # Extract only the +goose Up section (stop at +goose Down) before running.
    # This avoids running the rollback section when using plain psql -f.
    command: >
      sh -c "
        for f in /migrations/*.sql; do
          echo \"Applying $$f...\"
          awk '/-- [+]goose Down/{exit} {print}' \"$$f\" | psql -h db -U heapdeck -d heapdeck || exit 1
        done
        echo All migrations applied.
      "
    restart: on-failure

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: heapdeck-api:latest
    container_name: heapdeck-api-local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      DB_URL: postgres://heapdeck:${PG_PASS}@db:5432/heapdeck?sslmode=disable
      AUTH_MODE: ${AUTH_MODE:-token}
      API_TOKEN: ${API_TOKEN}
      JWT_SECRET: ${JWT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED:-false}
      OAUTH_REDIRECT_URL: ${OAUTH_REDIRECT_URL:-http://localhost:5173/auth/callback}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      CORS_ORIGINS: ${CORS_ORIGINS:-app://.,http://localhost:5173,http://localhost:5174,http://localhost:4173}
      REFRESH_INTERVAL_HOURS: ${REFRESH_INTERVAL_HOURS:-168}
      SEED_CHEATSHEETS: ${SEED_CHEATSHEETS:-true}
    ports:
      - "8080:8080"

volumes:
  pgdata_local:

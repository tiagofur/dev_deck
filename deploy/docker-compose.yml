# HeapDeck production stack — runs on the VPS.
#
# Five services:
#   db     — Postgres 16, persistent volume
#   api    — Go API, built from ../backend/Dockerfile
#   web    — React web app, built from ../apps/web/Dockerfile
#   caddy  — Reverse proxy with automatic Let's Encrypt TLS
#
# Setup:
#   1. cp .env.example .env  &&  edit values
#   2. docker compose up -d --build
#   3. (first time only) apply migration:
#      docker compose exec -T db psql -U heapdeck heapdeck < ../backend/migrations/0001_init.sql

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: heapdeck-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: heapdeck
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_DB: heapdeck
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heapdeck -d heapdeck"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not exposed publicly — only the api container talks to it
    networks:
      - internal

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ghcr.io/tiagofur/heapdeck-api:latest
    container_name: heapdeck-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DB_URL: postgres://heapdeck:${PG_PASS}@db:5432/heapdeck?sslmode=disable
      AUTH_MODE: ${AUTH_MODE:-jwt}
      JWT_SECRET: ${JWT_SECRET:-}
      REFRESH_SECRET: ${REFRESH_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_OAUTH_CALLBACK_URL: ${GITHUB_OAUTH_CALLBACK_URL:-}
      WEB_OAUTH_REDIRECT_URL: ${WEB_OAUTH_REDIRECT_URL:-}
      DESKTOP_OAUTH_REDIRECT_URL: ${DESKTOP_OAUTH_REDIRECT_URL:-}
      AUTH_COOKIE_MODE: ${AUTH_COOKIE_MODE:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_CALLBACK_URL: ${GOOGLE_OAUTH_CALLBACK_URL:-}
      # OAuth/password-reset links point back at the web domain
      FRONTEND_URL: ${FRONTEND_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-heuristic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      AI_EXTERNAL_OPT_IN: ${AI_EXTERNAL_OPT_IN:-false}
      LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED:-false}
      API_TOKEN: ${API_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-app://.}
      REFRESH_INTERVAL_HOURS: ${REFRESH_INTERVAL_HOURS:-168}
    ports:
      - "127.0.0.1:8085:8080"
    networks:
      - internal
      - web

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: ghcr.io/tiagofur/heapdeck-web:latest
    container_name: heapdeck-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3050:3000"
    networks:
      - web

  # Marketing landing (static Astro) — served at / and /es by Caddy
  landing:
    build:
      context: ..
      dockerfile: apps/landing/Dockerfile
    image: ghcr.io/tiagofur/heapdeck-landing:latest
    container_name: heapdeck-landing
    restart: unless-stopped
    ports:
      - "127.0.0.1:3051:3000"
    networks:
      - web

  # Monitoring (v1.0.0)
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: heapdeck-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    expose:
      - "9090"
    networks:
      - internal
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.0
    container_name: heapdeck-grafana
    restart: unless-stopped
    environment:
      # Refuse to boot with the default admin password: set GF_PASS in deploy/.env.
      - GF_SECURITY_ADMIN_PASSWORD=${GF_PASS:?GF_PASS must be set in deploy/.env}
      - GF_SERVER_ROOT_URL=https://monitor.${DOMAIN}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    expose:
      - "3000"
    networks:
      - web
      - internal
    depends_on:
      - prometheus

volumes:
  pgdata:
  prom_data:
  grafana_data:

networks:
  internal:
    driver: bridge
  web:
    driver: bridge
